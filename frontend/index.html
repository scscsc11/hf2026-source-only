<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070A12"><title>Simulation 3D Visualization</title><style>/* ============================================================
       OpenSim 3D Sim Console — Tactical Ops Theme
       Professional dark OLED base + glassmorphism HUD panels
       + cyan technical accents + semantic status colors.
       (ui-ux-pro-max design system: Dark Mode OLED + Real-Time Ops)
       ============================================================ */

    :root {
      /* ── Surfaces ── */
      --bg-void:        #070A12;            /* app void behind canvas */
      --panel-bg:       rgba(13, 20, 36, 0.72);
      --panel-bg-solid: #0D1424;
      --panel-bg-elev:  rgba(20, 30, 52, 0.85);
      --panel-border:        rgba(120, 180, 255, 0.14);
      --panel-border-strong: rgba(56, 189, 248, 0.40);
      --hairline:       rgba(255, 255, 255, 0.06);

      /* ── Geometry ── */
      --panel-radius:  10px;
      --radius-sm:     6px;
      --radius-pill:   999px;
      --panel-blur:    14px;
      --panel-w:       288px;
      --space-1: 4px;  --space-2: 8px;  --space-3: 12px;  --space-4: 16px;

      /* ── Accent / actions ── */
      --accent:        #38BDF8;            /* cyan-400 */
      --accent-2:      #22D3EE;
      --accent-dim:    rgba(56, 189, 248, 0.16);
      --accent-glow:   rgba(56, 189, 248, 0.45);
      --cta:           #F97316;            /* orange-500 */
      --cta-hover:     #FB923C;

      /* ── Text ── */
      --text:        #E6EDF6;
      --text-dim:    #9AAAC4;
      --text-muted:  #5C6B85;

      /* ── Status / semantics ── */
      --ok:    #22C55E;  --warn:  #F59E0B;  --err:   #EF4444;
      --team-blue:  #38BDF8;
      --team-red:   #F87171;
      --team-white: #CBD5E1;
      --decoy:      #F59E0B;

      /* ── Type ── (system stacks — works fully offline; 中文字体优先清晰渲染) */
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                   'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC',
                   'Hiragino Sans GB', Roboto, Arial, sans-serif;
      --font-mono: ui-monospace, 'Cascadia Code', 'SF Mono', 'JetBrains Mono',
                   'Fira Code', Consolas, 'Courier New', monospace;

      /* ── Depth ── */
      --shadow-panel: 0 10px 34px rgba(0, 0, 0, 0.55),
                      0 0 0 1px var(--panel-border);
      --shadow-pop:   0 14px 44px rgba(0, 0, 0, 0.65);
      --glow-accent:  0 0 0 1px var(--panel-border-strong),
                      0 0 18px var(--accent-glow);
      --inset-line:   inset 0 1px 0 rgba(255, 255, 255, 0.05);

      /* ── Motion / layering ── */
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --transition: 180ms var(--ease);
      --z-hud: 100; --z-pop: 1000; --z-pip: 9999;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-void);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }

    /* ── Shared glassmorphism HUD surface ── */
    .hud-panel {
      background: var(--panel-bg);
      -webkit-backdrop-filter: blur(var(--panel-blur)) saturate(140%);
      backdrop-filter: blur(var(--panel-blur)) saturate(140%);
      border: 1px solid var(--panel-border);
      border-radius: var(--panel-radius);
      box-shadow: var(--shadow-panel), var(--inset-line);
      color: var(--text);
      font-size: 13px;
    }

    /* ── Collapsible + draggable HUD panel structure (023) ── */
    .hud-panel[data-hud-panel] {
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .hud-panel__header {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      padding: 6px 14px;
      font-size: 12px;
      line-height: 1.5;
      cursor: grab;
      user-select: none;
      border-bottom: 1px solid var(--hairline);
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.06), transparent);
    }
    .hud-panel__header:active { cursor: grabbing; }
    .hud-panel__header h3 {
      margin: 0 !important;
      padding: 0 !important;
      border: none;
      font-size: 12px;
      line-height: 1.5;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }
    .hud-panel__header h3::before { display: none; }
    .hud-panel__chevron {
      flex-shrink: 0;
      color: var(--accent);
      font-size: 10px;
      transition: transform var(--transition);
    }
    .hud-panel.is-collapsed .hud-panel__chevron { transform: rotate(-90deg); }
    .hud-panel__body {
      flex: 1 1 auto;
      min-height: 0;
      padding: 12px 14px;
    }
    /* Panels whose body is a scroll region: no padding (inner list handles it). */
    #entity-info-panel .hud-panel__body,
    #entity-list-panel .hud-panel__body,
    #event-wall-panel .hud-panel__body,
    #scenario-selector .hud-panel__body {
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .hud-panel.is-collapsed .hud-panel__body { display: none !important; }
    .hud-panel.is-collapsed { height: auto !important; min-height: 0 !important; }
    .hud-panel.dragging {
      z-index: calc(var(--z-hud) + 50);
      box-shadow: var(--shadow-pop), var(--inset-line);
    }
    .hud-panel.dragging .hud-panel__header { cursor: grabbing; }

    /* Section / panel headings — uppercase tactical label w/ cyan accent rail */
    .hud-panel h3,
    .hud-panel h4 {
      color: var(--text);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .hud-panel h3 {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      padding-bottom: var(--space-2);
      margin-bottom: var(--space-3);
      border-bottom: 1px solid var(--hairline);
    }
    .hud-panel h3::before {
      content: '';
      width: 3px;
      height: 13px;
      border-radius: 2px;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }
    .hud-panel h4 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin: var(--space-3) 0 var(--space-1);
    }

    /* ── Form controls (shared) ── */
    input, select, button { font-family: inherit; }

    .hud-panel input[type="text"],
    .hud-panel input[type="number"],
    .hud-panel select {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 6px 8px;
      font-size: 12px;
      transition: border-color var(--transition), box-shadow var(--transition),
                  background var(--transition);
    }
    .hud-panel input[type="text"]:hover,
    .hud-panel input[type="number"]:hover,
    .hud-panel select:hover {
      border-color: rgba(56, 189, 248, 0.3);
      background: rgba(56, 189, 248, 0.05);
    }
    .hud-panel input[type="text"]:focus,
    .hud-panel input[type="number"]:focus,
    .hud-panel select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
      background: rgba(56, 189, 248, 0.06);
    }
    .hud-panel input::placeholder { color: var(--text-muted); }

    .hud-panel select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 24px;
      background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%),
                        linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
      background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .hud-panel select option {
      background: var(--panel-bg-solid);
      color: var(--text);
    }

    input[type="checkbox"] {
      accent-color: var(--accent);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    /* ============================================================
       Status bar — top-left connection / sim / FPS pill
       ============================================================ */
    #status-bar {
      position: absolute;
      top: var(--space-3);
      left: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      width: var(--panel-w);
      padding: 8px 14px;
      box-sizing: border-box;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
      z-index: var(--z-hud);
      white-space: nowrap;
    }
    #status-bar #connection-text { color: var(--text); white-space: nowrap; }
    #status-bar #simulation-status {
      color: var(--text-dim);
      padding-left: var(--space-2);
      border-left: 1px solid var(--hairline);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 1 1 auto;
    }
    #status-bar #fps-display {
      font-family: var(--font-mono);
      color: var(--text-dim);
      padding-left: var(--space-2);
      border-left: 1px solid var(--hairline);
      min-width: 64px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ============================================================
       Layer toggle — top-right display layers
       ============================================================ */
    #layer-toggle {
      position: absolute;
      top: var(--space-3);
      right: var(--space-3);
      width: var(--panel-w);
      z-index: var(--z-hud);
    }
    /* Spec 024: 图层开关 2×2 grid 紧凑(原竖排 ~180px → 2×2 ~80px,腾出垂直空间)。
       非等宽列:第二列(云台视场/地形)更宽,容纳“云台视场（上限50°）”完整单行显示。 */
    #layer-toggle .hud-panel__body {
      display: grid;
      grid-template-columns: minmax(0, 0.78fr) minmax(0, 1.22fr);
      gap: 2px 8px;
      padding-top: 2px;
    }
    #layer-toggle label {
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 3px;
      line-height: 1.15;
    }
    #layer-toggle label {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
      padding: 4px 2px;
      cursor: pointer;
      font-size: 12.5px;
      color: var(--text-dim);
      border-radius: var(--radius-sm);
      transition: color var(--transition), background var(--transition);
    }
    #layer-toggle label:hover {
      color: var(--text);
      background: var(--accent-dim);
    }
    #layer-toggle label:last-child { margin-bottom: 0; }
    #layer-toggle input[type="checkbox"] { margin: 0; }
    /* 保持图层名单行，避免长文本（如“云台视场（上限50°）”）折成两行 */
    #layer-toggle label { white-space: nowrap; }

    .control-section {
      margin-bottom: var(--space-3);
    }
    .control-section:last-child { margin-bottom: 0; }

    .control-section > label,
    .control-section label {
      display: block;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .input-row {
      display: flex;
      gap: var(--space-1);
      margin-bottom: var(--space-1);
    }
    .input-row input,
    .input-row select { flex: 1; min-width: 0; }

    /* Action buttons */
    .control-btn {
      width: 100%;
      margin-top: var(--space-2);
      padding: 8px var(--space-3);
      background: var(--accent-dim);
      border: 1px solid var(--panel-border-strong);
      border-radius: var(--radius-sm);
      color: var(--accent);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: background var(--transition), border-color var(--transition),
                  transform var(--transition), box-shadow var(--transition);
    }
    .control-btn:hover {
      background: rgba(56, 189, 248, 0.26);
      border-color: var(--accent);
      box-shadow: 0 0 14px var(--accent-glow);
    }
    .control-btn:active { transform: translateY(1px); }
    .control-btn.primary {
      background: var(--cta);
      border-color: var(--cta);
      color: #1a0d00;
    }
    .control-btn.primary:hover {
      background: var(--cta-hover);
      box-shadow: 0 0 16px rgba(249, 115, 22, 0.5);
    }
    .control-btn:disabled {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--hairline);
      color: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
    }

    .control-btn:focus-visible,
    .team-filter-btn:focus-visible,
    .entity-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    /* ============================================================
       Entity info panel — bottom-left telemetry
       ============================================================ */
    #entity-info-panel {
      position: absolute;
      bottom: var(--space-3);
      left: var(--space-3);
      width: var(--panel-w);
      /* Fixed size — content scrolls inside .info-content so the panel no
         longer jumps as entity data length varies. */
      height: calc((100vh - 94px) / 2);  /* Spec 024: 与 entity-list 均分左侧,中间 gap 18 */
      min-height: 240px;
      overflow: hidden;
      resize: vertical;  /* Spec 024: 用户可手动拉长 */
      z-index: var(--z-hud);
    }
    #entity-info-panel h3 { flex-shrink: 0; }
    #entity-info-panel #info-entity-name {
      color: var(--accent);
      font-family: var(--font-mono);
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
    }
    #entity-info-panel #info-entity-uid {
      font-size: 10.5px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-left: var(--space-1);
    }

    .info-hint {
      color: var(--text-muted);
      font-size: 12px;
      font-style: italic;
      padding: var(--space-1) 0;
    }

    .info-table {
      width: 100%;
      font-size: 11.5px;
      border-collapse: collapse;
    }
    .info-table tr td { padding: 3px 0; }
    .info-table tr td:first-child {
      color: var(--text-dim);
      width: 42%;
      text-transform: uppercase;
      font-size: 10.5px;
      letter-spacing: 0.04em;
    }
    .info-table tr td:last-child {
      color: var(--text);
      text-align: right;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* ── Scrollable content area inside the fixed-size panel ── */
    .info-content {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 14px 14px;
    }
    .info-content::-webkit-scrollbar { width: 6px; }
    .info-content::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 3px;
    }
    .info-content::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.4);
      border-radius: 3px;
    }
    .info-content::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.65); }

    /* ── Collapsible telemetry sections ── */
    .info-section { margin-bottom: var(--space-2); }
    .info-section:last-child { margin-bottom: 0; }

    .info-section__head {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 4px 2px;
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      color: var(--accent);
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-align: left;
      transition: background var(--transition), color var(--transition);
    }
    .info-section__head:hover { background: var(--accent-dim); }
    .info-section__head:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .info-section__chevron {
      display: inline-block;
      transition: transform var(--transition);
      font-size: 10px;
      line-height: 1;
    }
    .info-section.is-collapsed .info-section__chevron { transform: rotate(-90deg); }
    .info-section__body { padding: 2px 0 4px 10px; overflow: hidden; }
    .info-section.is-collapsed .info-section__body { display: none; }

    /* ============================================================
       Entity list panel — left column entity buttons
       ============================================================ */
    #entity-list-panel {
      position: absolute;
      top: 64px;
      left: var(--space-3);
      width: var(--panel-w);
      height: calc((100vh - 94px) / 2);  /* Spec 024: 与 entity-info 均分左侧,中间 gap 18(标准间距) */
      min-height: 220px;
      overflow: auto;
      resize: vertical;  /* Spec 024: 用户可手动拉长 */
      z-index: var(--z-hud);
    }

    #entity-list-panel h3 { flex-shrink: 0; }

    .entity-list {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      /* Spec 017 Bug 2: scroll so many entities fit; height is now fixed by
         the panel (no more jumping as entity count changes). */
      overflow-y: auto;
      padding: 4px 8px 4px 4px;
    }

    /* Scrollbars — slim, cyan, themed */
    .entity-list::-webkit-scrollbar,
    .event-wall-list::-webkit-scrollbar { width: 6px; }
    .entity-list::-webkit-scrollbar-track,
    .event-wall-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 3px;
    }
    .entity-list::-webkit-scrollbar-thumb,
    .event-wall-list::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.4);
      border-radius: 3px;
    }
    .entity-list::-webkit-scrollbar-thumb:hover,
    .event-wall-list::-webkit-scrollbar-thumb:hover {
      background: rgba(56, 189, 248, 0.65);
    }

    .entity-btn {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 7px 10px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-dim);
      cursor: pointer;
      font-size: 12.5px;
      text-align: left;
      transition: background var(--transition), border-color var(--transition),
                  color var(--transition);
    }
    .entity-btn:hover {
      background: var(--accent-dim);
      border-color: rgba(56, 189, 248, 0.4);
      color: var(--text);
    }
    .entity-btn.selected {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--accent);
      color: #fff;
      box-shadow: var(--glow-accent);
    }
    .entity-btn strong { color: var(--text); font-weight: 600; }
    .entity-btn.selected strong { color: #fff; }

    .entity-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      box-shadow: 0 0 6px currentColor;
    }
    .uav-dot    { background-color: var(--team-blue);  color: var(--team-blue); }
    .target-dot { background-color: var(--team-red);   color: var(--team-red); }
    .gimbal-dot { background-color: #FFE066;           color: #FFE066; }
    /* Spec 017 FR-016: decoy dot color (amber, distinct from real target red). */
    .decoy-dot  { background-color: var(--decoy);      color: var(--decoy); }

    /* Connection status indicator */
    .connection-status {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 8px currentColor;
    }
    .connected    { background-color: var(--ok);   color: var(--ok); }
    .disconnected { background-color: var(--err);  color: var(--err); }
    .reconnecting {
      background-color: var(--warn);
      color: var(--warn);
      animation: pulse 1.1s var(--ease) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.45; transform: scale(0.82); }
    }

    /* ============================================================
       Competition config —— 已合并到 #scenario-selector 内的配置行
       (.sc-config-row), 此处不再保留独立面板样式。
       ============================================================ */

    /* ============================================================
       Camera PiP — body-appended floating video feed (Spec 022)
       Cosmetic look lives here; positional inline styles are driven
       by camera-pip.ts drag/resize logic and must stay inline.
       ============================================================ */
    .camera-pip {
      background: var(--panel-bg);
      -webkit-backdrop-filter: blur(var(--panel-blur)) saturate(140%);
      backdrop-filter: blur(var(--panel-blur)) saturate(140%);
      border: 1px solid var(--panel-border);
      border-radius: var(--panel-radius);
      box-shadow: var(--shadow-pop);
      z-index: var(--z-pip);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      transition: box-shadow var(--transition), height var(--transition);
    }
    .camera-pip:hover { box-shadow: var(--shadow-pop), var(--glow-accent); }

    /* Header — clickable title bar; click toggles collapse (023). */
    .camera-pip__header {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      padding: 8px 30px 8px 10px;
      font-size: 12px;
      line-height: 1.5;
      cursor: pointer;
      user-select: none;
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.10), rgba(56, 189, 248, 0.02));
      border-bottom: 1px solid var(--panel-border);
    }
    .camera-pip__chevron {
      flex-shrink: 0;
      color: var(--accent);
      font-size: 10px;
      transition: transform var(--transition);
    }
    .camera-pip__title {
      flex: 1 1 auto;
      min-width: 0;
      color: var(--text-dim);
      font-family: var(--font-sans);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .camera-pip canvas {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
    .camera-pip .camera-pip__bar {
      flex-shrink: 0;
      height: 22px;
      line-height: 22px;
      color: var(--accent);
      background: rgba(7, 10, 18, 0.5);
      border-top: 1px solid var(--panel-border);
      font-size: 10.5px;
      padding: 0 8px;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 6px var(--accent-glow);
    }
    .camera-pip .camera-pip__close {
      position: absolute;
      top: 3px;
      right: 5px;
      width: 20px;
      height: 20px;
      line-height: 18px;
      text-align: center;
      cursor: pointer;
      color: var(--text-dim);
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      transition: background var(--transition), color var(--transition);
    }
    .camera-pip .camera-pip__close:hover {
      background: var(--err);
      color: #fff;
      border-color: var(--err);
    }
    .camera-pip .camera-pip__resize {
      position: absolute;
      right: 0;
      bottom: 22px;
      width: 14px;
      height: 14px;
      cursor: nwse-resize;
      background: linear-gradient(135deg, transparent 45%, var(--accent) 45%, var(--accent) 60%, transparent 60%, transparent 75%, var(--accent) 75%, var(--accent) 90%, transparent 90%);
      opacity: 0.6;
      transition: opacity var(--transition);
    }
    .camera-pip:hover .camera-pip__resize { opacity: 1; }

    /* Collapsed state — title bar only, video area hidden (023). */
    .camera-pip.is-collapsed canvas,
    .camera-pip.is-collapsed .camera-pip__bar,
    .camera-pip.is-collapsed .camera-pip__resize { display: none !important; }
    .camera-pip.is-collapsed .camera-pip__chevron { transform: rotate(-90deg); }

    /* ============================================================
       Accessibility & reduced motion
       ============================================================ */
    a:focus-visible, button:focus-visible, input:focus-visible,
    select:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  /* ============================================================
       Event wall — right column event log (Spec 018)
       位于 layer-toggle 与 scenario-selector 之间, 顶部只占 ~160px,
       把右侧下半留给 scenario-selector 完整显示三个赛题(无滚动)。
       ============================================================ */
    #event-wall-panel {
      position: absolute;
      top: 141px;  /* layer-toggle bottom(123) + gap 18(标准间距) */
      right: var(--space-3);
      width: var(--panel-w);
      height: 180px;
      min-height: 140px;
      overflow: hidden;
      resize: vertical;
      z-index: var(--z-hud);
    }
    #event-wall-panel .hud-panel__body {
      padding: 0;
      display: flex; flex-direction: column;
    }

    .event-wall-filter {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      flex-wrap: wrap;
      padding: 6px 10px;
      border-bottom: 1px solid var(--hairline);
    }

    .team-filter-btn {
      padding: 3px 9px;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 10.5px;
      font-weight: 500;
      text-transform: capitalize;
      transition: background var(--transition), color var(--transition),
                  border-color var(--transition);
    }
    .team-filter-btn:hover {
      background: var(--accent-dim);
      color: var(--text);
      border-color: rgba(56, 189, 248, 0.3);
    }
    .team-filter-btn.active {
      background: rgba(56, 189, 248, 0.24);
      border-color: var(--accent);
      color: #fff;
    }
    .team-filter-btn[data-team="red"].active {
      background: rgba(248, 113, 113, 0.22);
      border-color: var(--team-red);
      color: #fff;
    }
    .team-filter-btn[data-team="blue"].active {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--team-blue);
    }

    .event-wall-list {
      flex: 1; min-height: 0;
      overflow-y: auto;
      padding: var(--space-2);
    }
    .event-wall-list::-webkit-scrollbar { width: 6px; }
    .event-wall-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.25); border-radius: 3px; }
    .event-wall-list::-webkit-scrollbar-thumb { background: rgba(56,189,248,0.4); border-radius: 3px; }
    .event-wall-list::-webkit-scrollbar-thumb:hover { background: rgba(56,189,248,0.65); }

    .event-wall-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 22px 0;
      font-style: italic;
      font-size: 12px;
    }

    .event-item {
      padding: 7px 9px;
      margin-bottom: 4px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--text-muted);
      background: rgba(255, 255, 255, 0.025);
      cursor: default;
      transition: background var(--transition), transform var(--transition);
    }
    .event-item:hover {
      background: rgba(56, 189, 248, 0.07);
      transform: translateX(2px);
    }
    .event-item:last-child { margin-bottom: 0; }
    .event-item.source-kernel    { border-left-color: #C084FC; }
    .event-item.source-external  { border-left-color: var(--accent); }
    .event-item.event-enter-track  { border-left-color: var(--ok); }
    .event-item.event-exit-track   { border-left-color: var(--warn); }
    .event-item.event-discovered   { border-left-color: var(--err); }

    .event-item-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 3px;
    }
    .event-type-label {
      font-weight: 600; font-size: 11.5px; color: var(--text);
    }
    .event-sim-time {
      font-size: 10px; color: var(--text-muted);
      font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    }
    .event-item-body { font-size: 11px; color: var(--text-dim); line-height: 1.5; }

    .event-source-tag {
      display: inline-block; padding: 1px 6px; border-radius: var(--radius-pill);
      font-size: 9.5px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; margin-right: 4px;
    }
    .event-source-tag.kernel   { background: rgba(192,132,252,0.18); color: #D8B4FE; }
    .event-source-tag.external { background: rgba(56,189,248,0.18);  color: var(--accent); }

    .event-team-tag {
      display: inline-block; padding: 1px 6px; border-radius: var(--radius-pill);
      font-size: 9.5px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; margin-left: 4px;
    }
    .event-team-tag.white { background: rgba(203,213,225,0.14); color: var(--team-white); }
    .event-team-tag.red   { background: rgba(248,113,113,0.18); color: var(--team-red); }
    .event-team-tag.blue  { background: rgba(56,189,248,0.18);  color: var(--team-blue); }

    /* Spec 024: 示例选择与仿真启动面板 */
  /* 右侧下半(event-wall-panel 顶部固定 180px 高, 底 = 141+180 = 321)。
     顶 = 321 + 18 gap = 339, 底 12; 默认 ~360px 给赛题列表完整显示三题。
     进度条显示时挤压中间区域,按钮固定贴底; 用户也可手动拉长(resize:vertical)。 */
  #scenario-selector {
    position: absolute;
    top: 339px;  /* event-wall 底(321) + gap 18 */
    right: var(--space-3);
    width: var(--panel-w);
    /* 显式 height(非 top+bottom 双向定位): 折叠时 .is-collapsed 的
       height:auto!important 才能真正释放高度塌缩到 header; resize:vertical
       也只在显式 height 下才能正常拖拽。其它面板(entity-info/list/event-wall)
       均用显式 height, 这里对齐。顶 339 + 底 12 = 351。 */
    height: calc(100vh - 351px);
    min-height: 360px;
    /* 不设 max-height: 顶固定 top:339px, 向上拉伸不会超视口顶; max-height 会
       把拉伸空间卡死(原 100vh-363px 仅比 height 多 12px, 拉不动)。其它能拉伸的
       面板(entity-info/list) 也都不设 max-height。 */
    display: flex; flex-direction: column;
    resize: vertical;
    overflow: hidden;
    z-index: var(--z-hud);
  }
  /* body 内部用 flex 列, 中间内容(赛题列表等)可滚动, 按钮区不缩 */
  #scenario-selector .hud-panel__body {
    flex: 1 1 auto;
    min-height: 0;
    display: flex; flex-direction: column;
    padding: 0;
    overflow: hidden;  /* 内部各 section 自己处理滚动 */
  }
  #scenario-selector .sc-progress { padding: 4px 10px 0; margin: 0; flex: 0 0 auto; }
  #scenario-selector .sc-buttons {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 6px 8px 8px;
    margin: 0;
    flex: 0 0 auto;  /* 按钮区不被 progress 挤压 */
  }
  #scenario-selector .sc-buttons .control-btn { flex: 1; min-width: 68px; margin-top: 0; }
  #scenario-selector .sc-error { padding: 0 10px 4px; margin: 0; font-size: 12px; color: #f44336; }
  #scenario-selector .sc-progress-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
  #scenario-selector .sc-progress-fill { height: 100%; background: var(--accent, #38BDF8); box-shadow: 0 0 12px rgba(56,189,248,0.6); transition: width 0.25s ease; border-radius: 3px; }
  #scenario-selector .sc-progress-text { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 4px; font-family: var(--font-mono, monospace); font-variant-numeric: tabular-nums; }

  /* ── Spec 024 风格赛题列表 ─────────────────────────────────── */
  /* body flex 列, 各 section 自然高度, 空白由 margin-top:auto 推到按钮上方。
     这里不强行均分空白(之前用 justify-content:center 导致内容被推到 section
     边缘外); 而是让 list 自然撑开,把空白吃掉在赛题列表底部,看起来最自然。 */
  #scenario-selector .hud-panel__body {
    display: flex; flex-direction: column;
    padding: 0;
  }
  /* 赛题列表: 中间区, flex 撑开; 进度条出现挤压空间时, 内部可滚动,
     按钮区固定不动。 */
  #scenario-selector .sc-list {
    display: flex; flex-direction: column; gap: 3px;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 6px 8px 4px;
    margin: 0;
  }
  #scenario-selector .sc-scenario-card {
    padding: 6px 10px 7px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  #scenario-selector .sc-scenario-card:hover { background: rgba(255,255,255,0.06); }
  #scenario-selector .sc-scenario-card.selected {
    border-color: var(--accent, #38BDF8);
    background: rgba(56,189,248,0.10);
    box-shadow: 0 0 0 1px var(--accent, #38BDF8) inset;
  }
  #scenario-selector .sc-scenario-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  #scenario-selector .sc-scenario-radio {
    width: 12px; height: 12px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.4);
    flex-shrink: 0; position: relative; transition: border-color 0.15s ease;
  }
  #scenario-selector .sc-scenario-card.selected .sc-scenario-radio { border-color: var(--accent, #38BDF8); }
  #scenario-selector .sc-scenario-radio.checked::after {
    content: ''; position: absolute; inset: 2px;
    border-radius: 50%; background: var(--accent, #38BDF8);
    box-shadow: 0 0 6px var(--accent-glow);
  }
  #scenario-selector .sc-scenario-name { font-size: 13px; color: #fff; font-weight: 500; }
  #scenario-selector .sc-scenario-desc {
    font-size: 11.5px; color: rgba(255,255,255,0.55); line-height: 1.5;
    margin-left: 20px;
  }
  #scenario-selector .sc-scenario-card.unavailable .sc-scenario-name { color: rgba(255,255,255,0.45); }
  #scenario-selector .sc-scenario-card.unavailable { cursor: not-allowed; opacity: 0.7; }

  /* 配置行: 天气 + 车辆随机路线种子(单行) */
  #scenario-selector .sc-config-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    flex: 0 0 auto;
    padding: 6px 10px;
    margin: 0;
    border-top: 1px solid var(--hairline, rgba(255,255,255,0.06));
  }
  #scenario-selector .sc-config-item { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  #scenario-selector .sc-config-label {
    font-size: 10px; color: rgba(255,255,255,0.55);
    text-transform: uppercase; letter-spacing: 0.04em;
    white-space: nowrap;
  }
  #scenario-selector .sc-config-item select,
  #scenario-selector .sc-config-item input {
    width: 100%; min-width: 0;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--panel-border, rgba(255,255,255,0.14));
    border-radius: 4px;
    color: #fff;
    padding: 4px 7px;
    font-size: 12px;
    font-family: inherit;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  #scenario-selector .sc-config-item select:hover,
  #scenario-selector .sc-config-item input:hover {
    border-color: rgba(56,189,248,0.3);
    background: rgba(56,189,248,0.05);
  }
  #scenario-selector .sc-config-item select:focus,
  #scenario-selector .sc-config-item input:focus {
    outline: none;
    border-color: var(--accent, #38BDF8);
    box-shadow: 0 0 0 3px rgba(56,189,248,0.16);
  }
  #scenario-selector .sc-config-item input::placeholder { color: rgba(255,255,255,0.35); }
  #scenario-selector .sc-config-item input { font-variant-numeric: tabular-nums; }
  /* 仿真运行中(内核存活)锁定天气/种子配置: 变灰、禁止点选(与 .control-btn:disabled 风格一致) */
  #scenario-selector .sc-config-item select:disabled,
  #scenario-selector .sc-config-item input:disabled {
    background: rgba(255, 255, 255, 0.02);
    border-color: var(--hairline, rgba(255,255,255,0.06));
    color: var(--text-muted, #5C6B85);
    cursor: not-allowed;
    box-shadow: none;
    opacity: 0.7;
  }

  /* 算法选择栏: 放在所有赛题的最下面(选中赛题后才显示) */
  #scenario-selector .sc-algo-picker {
    flex: 0 0 auto;
    padding: 6px 10px;
    margin: 0;
    border-top: 1px solid var(--hairline, rgba(255,255,255,0.06));
  }
  #scenario-selector .sc-algo-mode-row { display: flex; gap: 6px; margin-bottom: 4px; }
  #scenario-selector .sc-algo-mode-row .sc-mode-item {
    display: flex; align-items: center; gap: 6px;
    flex: 1; padding: 4px 10px; border-radius: 6px;
    cursor: pointer; background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  #scenario-selector .sc-algo-mode-row .sc-mode-item:hover { background: rgba(255,255,255,0.06); }
  #scenario-selector .sc-algo-mode-row .sc-mode-item input { margin: 0; accent-color: var(--accent, #38BDF8); }
  #scenario-selector .sc-algo-mode-row .sc-mode-item:has(input:checked) {
    border-color: var(--accent, #38BDF8);
    background: rgba(56,189,248,0.10);
  }
  #scenario-selector .sc-algo-mode-row .sc-mode-name { font-size: 12px; color: rgba(255,255,255,0.9); }
  /* 参赛者算法列表(单选) */
  #scenario-selector .sc-user-list {
    margin-top: 2px; padding: 2px 0;
    display: flex; flex-direction: column; gap: 1px;
    max-height: 26vh; overflow-y: auto;
  }
  #scenario-selector .sc-algo-item { display: flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 5px; cursor: pointer; }
  #scenario-selector .sc-algo-item:hover { background: rgba(255,255,255,0.05); }
  #scenario-selector .sc-algo-item input { margin: 0; accent-color: var(--accent, #38BDF8); }
  #scenario-selector .sc-algo-item:has(input:checked) { background: rgba(56,189,248,0.10); }
  #scenario-selector .sc-algo-name { font-size: 12px; color: rgba(255,255,255,0.9); flex: 1; }
  #scenario-selector .sc-algo-tag { font-size: 9px; padding: 1px 5px; border-radius: 4px; }
  #scenario-selector .sc-algo-tag.user { color: #34d399; background: rgba(52,211,153,0.12); }
  #scenario-selector .sc-algo-doc { font-size: 10px; color: rgba(255,255,255,0.4); margin-left: 20px; flex-basis: 100%; }
  #scenario-selector .sc-empty { font-size: 11px; color: rgba(255,255,255,0.4); padding: 4px 8px; line-height: 1.5; word-break: break-word; }
  #scenario-selector .sc-empty code { font-family: var(--font-mono, monospace); color: var(--accent, #38BDF8); font-size: 10px; word-break: break-all; }
  /* 刷新按钮: 紧跟在参赛者算法列表下方 */
  #scenario-selector .sc-refresh-btn {
    width: 100%;
    margin-top: 4px;
    font-size: 10.5px;
    padding: 4px 8px;
    opacity: 0.85;
  }
  #scenario-selector .sc-refresh-btn:hover { opacity: 1; }

  /* ── Spec 025: 实时评分浮动居中面板 ─────────────────────────── */
  /* 折叠态: 屏幕中央半透明圆形按钮(56px),只显示总分整数。 */
  #score-panel {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    z-index: var(--z-hud, 50);
    pointer-events: none;
    font-family: var(--font-ui, sans-serif);
  }
  #score-panel .score-panel__collapsed {
    display: none;
    pointer-events: auto;
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 1px solid rgba(56,189,248,0.55);
    background: rgba(13,21,38,0.78);
    color: var(--accent, #38BDF8);
    font-family: var(--font-mono, monospace);
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 24px rgba(0,0,0,0.55), 0 0 24px rgba(56,189,248,0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: transform var(--transition, 180ms) cubic-bezier(0.4,0,0.2,1),
                box-shadow var(--transition, 180ms) cubic-bezier(0.4,0,0.2,1);
  }
  #score-panel .score-panel__collapsed:hover {
    transform: scale(1.06);
    box-shadow: 0 6px 28px rgba(0,0,0,0.6), 0 0 32px rgba(56,189,248,0.55);
  }
  #score-panel .score-panel__collapsed-score {
    display: inline-block;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  #score-panel.score-panel--collapsed .score-panel__collapsed { display: inline-flex;
    align-items: center; justify-content: center; }

  /* 展开态: 居中窄面板(max-width 320px),玻璃质感。 */
  #score-panel .score-panel__expanded {
    display: none;
    pointer-events: auto;
    width: 320px;
    padding: 14px 16px 12px;
    border-radius: 12px;
    background: rgba(13,21,38,0.86);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 12px 40px rgba(0,0,0,0.65);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: #fff;
  }
  #score-panel.score-panel--expanded .score-panel__collapsed { display: none; }
  #score-panel.score-panel--expanded .score-panel__expanded { display: block; }

  #score-panel .score-panel__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  #score-panel .score-panel__header h3 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(255,255,255,0.85);
  }
  #score-panel .score-panel__close {
    appearance: none;
    background: transparent;
    border: 0;
    color: rgba(255,255,255,0.55);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
    transition: color var(--transition, 180ms) ease;
  }
  #score-panel .score-panel__close:hover { color: #fff; }

  #score-panel .score-panel__total {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 6px;
  }
  #score-panel .score-panel__total-value {
    font-family: var(--font-mono, monospace);
    font-size: 38px;
    font-weight: 600;
    color: var(--accent, #38BDF8);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #score-panel .score-panel__total-suffix {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    font-family: var(--font-mono, monospace);
  }
  #score-panel .score-panel__badge {
    margin-left: auto;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    font-family: var(--font-mono, monospace);
    letter-spacing: 0.04em;
  }
  #score-panel .score-panel__badge--pass {
    background: rgba(76,175,80,0.20);
    color: #81c784;
    border: 1px solid rgba(76,175,80,0.45);
  }
  #score-panel .score-panel__badge--fail {
    background: rgba(244,67,54,0.18);
    color: #e57373;
    border: 1px solid rgba(244,67,54,0.40);
  }
  #score-panel .score-panel__badge--pending {
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.10);
  }
  #score-panel .score-panel__badge--unavailable {
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.40);
    border: 1px solid rgba(255,255,255,0.08);
  }

  #score-panel .score-panel__meta {
    font-size: 11px;
    color: rgba(255,255,255,0.55);
    font-family: var(--font-mono, monospace);
    margin-bottom: 10px;
  }
  #score-panel .score-panel__meta-label {
    color: rgba(255,255,255,0.40);
  }

  #score-panel .score-panel__dimensions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 8px;
  }
  #score-panel .score-panel__dim {
    display: grid;
    grid-template-columns: 96px 1fr 44px;
    align-items: center;
    gap: 8px;
    font-size: 11px;
  }
  #score-panel .score-panel__dim-label {
    color: rgba(255,255,255,0.65);
    font-family: var(--font-mono, monospace);
  }
  #score-panel .score-panel__dim-track {
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
  }
  #score-panel .score-panel__dim-fill {
    height: 100%;
    background: linear-gradient(90deg,
      rgba(56,189,248,0.85), rgba(76,175,80,0.85));
    transition: width 0.25s ease;
    border-radius: 2px;
  }
  #score-panel .score-panel__dim-value {
    text-align: right;
    color: rgba(255,255,255,0.85);
    font-family: var(--font-mono, monospace);
    font-variant-numeric: tabular-nums;
  }

  #score-panel .score-panel__final {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 11px;
    color: rgba(129,199,132,0.85);
    font-family: var(--font-mono, monospace);
    word-break: break-all;
  }
  #score-panel .score-panel__unavailable {
    margin-top: 8px;
    font-size: 12px;
    color: rgba(255,255,255,0.40);
    text-align: center;
  }
  @media (prefers-reduced-motion: reduce) {
    #score-panel .score-panel__collapsed,
    #score-panel .score-panel__dim-fill { transition: none; }
  }

  /* ── 仿真结束结果总结弹窗 (result-modal) ──────────────────────── */
  /* 默认隐藏, .result-modal--open 时显示。z-index 高于 score-panel(50)。 */
  #result-modal { display: none; }
  #result-modal.result-modal--open { display: block; }
  #result-modal .result-modal__overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(4, 8, 18, 0.62);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: result-modal-fade 160ms ease-out;
  }
  #result-modal .result-modal__card {
    width: 380px;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 64px);
    overflow-y: auto;
    padding: 22px 24px 18px;
    border-radius: 14px;
    background: rgba(13, 21, 38, 0.92);
    border: 1px solid rgba(56, 189, 248, 0.28);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(56, 189, 248, 0.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: #fff;
    font-family: var(--font-ui, sans-serif);
    animation: result-modal-pop 200ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #result-modal .result-modal__header {
    margin-bottom: 12px;
  }
  #result-modal .result-modal__header h3 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: rgba(255, 255, 255, 0.7);
  }
  #result-modal .result-modal__total {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 6px;
  }
  #result-modal .result-modal__total-value {
    font-family: var(--font-mono, monospace);
    font-size: 52px;
    font-weight: 600;
    color: var(--accent, #38BDF8);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #result-modal .result-modal__total-suffix {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.45);
    font-family: var(--font-mono, monospace);
  }
  #result-modal .result-modal__badge {
    margin-left: auto;
    font-size: 13px;
    padding: 5px 12px;
    border-radius: 999px;
    font-family: var(--font-mono, monospace);
    letter-spacing: 0.04em;
    font-weight: 600;
  }
  #result-modal .result-modal__badge--pass {
    background: rgba(76, 175, 80, 0.20);
    color: #81c784;
    border: 1px solid rgba(76, 175, 80, 0.45);
  }
  #result-modal .result-modal__badge--fail {
    background: rgba(244, 67, 54, 0.18);
    color: #e57373;
    border: 1px solid rgba(244, 67, 54, 0.40);
  }
  #result-modal .result-modal__meta {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.55);
    font-family: var(--font-mono, monospace);
    margin-bottom: 16px;
  }
  #result-modal .result-modal__meta-label {
    color: rgba(255, 255, 255, 0.4);
  }
  #result-modal .result-modal__dimensions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }
  #result-modal .result-modal__dim {
    display: grid;
    grid-template-columns: 110px 1fr 48px;
    align-items: center;
    gap: 10px;
    font-size: 12px;
  }
  #result-modal .result-modal__dim-label {
    color: rgba(255, 255, 255, 0.7);
    font-family: var(--font-mono, monospace);
  }
  #result-modal .result-modal__dim-track {
    height: 6px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 3px;
    overflow: hidden;
  }
  #result-modal .result-modal__dim-fill {
    height: 100%;
    background: linear-gradient(90deg,
      rgba(56, 189, 248, 0.85), rgba(76, 175, 80, 0.85));
    border-radius: 3px;
  }
  #result-modal .result-modal__dim-value {
    text-align: right;
    color: rgba(255, 255, 255, 0.9);
    font-family: var(--font-mono, monospace);
    font-variant-numeric: tabular-nums;
  }
  #result-modal .result-modal__path {
    margin-bottom: 18px;
    padding: 10px 12px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 8px;
  }
  #result-modal .result-modal__path-hint {
    font-size: 11px;
    color: rgba(129, 199, 132, 0.8);
    margin-bottom: 6px;
  }
  #result-modal .result-modal__path-value {
    display: block;
    font-family: var(--font-mono, monospace);
    font-size: 11px;
    color: rgba(255, 255, 255, 0.75);
    word-break: break-all;
    line-height: 1.5;
    /* 允许用户选中复制完整路径(不随全局 user-select:none 被禁)。 */
    user-select: text;
    -webkit-user-select: text;
  }
  #result-modal .result-modal__actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  #result-modal .result-modal__btn {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 13px;
    font-family: var(--font-ui, sans-serif);
    cursor: pointer;
    transition: background var(--transition, 180ms) ease,
                border-color var(--transition, 180ms) ease;
  }
  #result-modal .result-modal__btn--close {
    background: transparent;
    color: rgba(255, 255, 255, 0.8);
  }
  #result-modal .result-modal__btn--close:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(255, 255, 255, 0.3);
  }
  #result-modal .result-modal__btn--rerun {
    background: rgba(56, 189, 248, 0.16);
    border-color: rgba(56, 189, 248, 0.5);
    color: var(--accent, #38BDF8);
    font-weight: 600;
  }
  #result-modal .result-modal__btn--rerun:hover {
    background: rgba(56, 189, 248, 0.28);
    border-color: rgba(56, 189, 248, 0.7);
  }
  @keyframes result-modal-fade {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes result-modal-pop {
    from { opacity: 0; transform: scale(0.94); }
    to { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    #result-modal .result-modal__overlay,
    #result-modal .result-modal__card { animation: none; }
  }

/* 使用引导按钮 —— 感叹号小图标, 置于赛题与算法面板标题栏右侧,
     与 .hud-panel 标题颜色/大小一致(--text-dim + 12px), 悬停变 accent。 */
  #help-btn.help-icon-btn {
    margin-left: auto;
    width: 20px; height: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0;
    background: transparent;
    border: 1px solid var(--panel-border);
    border-radius: 50%;
    color: var(--text-dim);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    transition: color var(--transition), border-color var(--transition),
                background var(--transition);
  }
  #help-btn.help-icon-btn:hover {
    color: var(--accent);
    border-color: var(--panel-border-strong);
    background: var(--accent-dim);
  }</style><script defer="defer" src="bundle.js"></script></head><body><div id="app"><div id="canvas-container"></div><div id="status-bar" class="hud-panel"><span class="connection-status disconnected" id="connection-indicator"></span> <span id="connection-text">未连接</span> <span id="simulation-status"></span> <span id="fps-display"></span></div><div id="layer-toggle" class="hud-panel" data-hud-panel><div class="hud-panel__header"><span class="hud-panel__chevron" aria-hidden="true">▾</span><h3>显示图层</h3></div><div class="hud-panel__body"><label><input type="checkbox" id="toggle-trails" checked="checked"> 轨迹尾迹</label> <label title="云台相机 FOV 上限 50°"><input type="checkbox" id="toggle-gimbal-fov" checked="checked"> 云台视场（上限50°）</label> <label><input type="checkbox" id="toggle-navigation-path" checked="checked"> 导航路径</label> <label><input type="checkbox" id="toggle-terrain" checked="checked"> 地形</label></div></div><div id="scenario-selector" class="hud-panel" data-hud-panel><div class="hud-panel__header"><span class="hud-panel__chevron" aria-hidden="true">▾</span><h3>赛题与算法</h3><button id="help-btn" class="help-icon-btn" type="button" title="使用引导" aria-label="使用引导">?</button></div><div class="hud-panel__body" id="scenario-selector-body"></div></div><div id="entity-list-panel" class="hud-panel" data-hud-panel><div class="hud-panel__header"><span class="hud-panel__chevron" aria-hidden="true">▾</span><h3>实体列表</h3></div><div class="hud-panel__body"><div class="entity-list" id="entity-list"></div></div></div><div id="event-wall-panel" class="hud-panel" data-hud-panel><div class="hud-panel__header"><span class="hud-panel__chevron" aria-hidden="true">▾</span><h3>事件墙</h3></div><div class="hud-panel__body"><div class="event-wall-filter" id="event-wall-filter"><button class="team-filter-btn active" data-team="white">白方</button> <button class="team-filter-btn" data-team="red">红方</button> <button class="team-filter-btn" data-team="blue">蓝方</button> <button class="team-filter-btn" data-team="all">全部</button></div><div class="event-wall-list" id="event-wall-list"><p class="event-wall-empty">暂无事件</p></div></div></div><div id="entity-info-panel" class="hud-panel" data-hud-panel><div class="hud-panel__header"><span class="hud-panel__chevron" aria-hidden="true">▾</span><h3>实体信息 <span id="info-entity-name"></span><span id="info-entity-uid"></span></h3></div><div class="hud-panel__body"><div class="info-content" id="info-content"><p class="info-hint">点击 3D 场景中的实体查看其数据</p></div></div></div><div id="score-panel"></div><div id="result-modal"></div></div></body></html>
